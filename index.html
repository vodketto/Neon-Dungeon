<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Neon Dungeon | Roguelite Shoot-Em-Up</title>
    <!-- PWA Setup tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeonDungeon" />
    <meta name="description" content="Cyberpunk action rougelite bullet hell. Fight glitched computer virus enemies, level up with dynamic slot machines, upgrade deep abilities, and survive." />
  </head>
  <body class="bg-gray-950 select-none overflow-hidden touch-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Register Service Worker for offline play capabilities -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((reg) => {
              console.log('Neon Dungeon PWA Service Worker registered successfully:', reg.scope);
            })
            .catch((err) => {
              console.warn('Neon Dungeon PWA Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
